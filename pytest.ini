[pytest]
testpaths = tests
addopts = --strict-markers
markers =
    unit: no hardware needed (pure Python or virtual CAN bus)
    setup_a: bench Setup A - Arduino #1 OFF, Python sends 0x123 via the CANable
    setup_b: bench Setup B - Arduino #1 ON (sends 0x123)
    special: special wiring, see the test header (e.g. TC-05 start-up)
    long: runs longer than 1 minute, not part of the quick regression
    smoke: bench check, run first in every session